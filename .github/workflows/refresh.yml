name: Refresh CAAPWATCH data

# Decoupled data layer: this is the ONLY thing that touches the network. It runs
# the /scripts fetchers on a daily cron, commits any changed JSON in /data back
# to the repo, then stops. GitHub Pages just serves the committed files, so the
# live site never makes an API call and never spins down.

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC daily (GitHub may delay busy-period crons)
  workflow_dispatch: {}      # lets you trigger a refresh by hand from the Actions tab

# Allow the job to push the refreshed JSON back to the repository.
permissions:
  contents: write

# Never run two refreshes at once (avoids racing commits).
concurrency:
  group: caapwatch-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The fetchers are stdlib-only, so there is no `pip install` step that
      # could break the build. Each script is resilient: on any fetch/parse
      # failure it leaves its existing JSON untouched and exits 0, so one bad
      # feed can never fail the whole refresh or blank the dashboard.
      - name: Run fetchers
        run: |
          set +e
          status=0
          for feed in traffic gdp concession fuel armenia price; do
            script="scripts/fetch_${feed}.py"
            if [ -f "$script" ]; then
              echo "::group::${script}"
              python3 "$script"
              code=$?
              echo "exit ${code} :: ${script}"
              echo "::endgroup::"
              [ $code -ne 0 ] && status=1
            else
              echo "skip ${script} (not built yet)"
            fi
          done
          # Surface unexpected crashes in the run summary, but don't abort the commit.
          exit 0

      - name: Commit refreshed data
        run: |
          git config user.name "caapwatch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
            git push || (git pull --rebase --autostash && git push)
          fi
